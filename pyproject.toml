[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nextpass"
dynamic = ["version", "dependencies"]
description = "Terminal-based satellite reception planning for Meteor-M2-3/4, ISS, Tiangong (CSS), AO-73, RS-44, SO-50, AO-123, AO-91, FO-29, Metop-B/C, Fengyun-3A/3C, GOES-18/19 and Elektro-L 3. Supports NORAD IDs and custom catalogs."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.9"

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[project.scripts]
nextpass = "nextpass.meteor_passes:main"

[tool.setuptools]
packages = ["nextpass"]

[tool.setuptools.package-data]
nextpass = ["catalog.json"]

[tool.setuptools.dynamic]
version = {attr = "nextpass.version.APP_VERSION"}
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.urls]
Homepage = "https://github.com/gdamdam/nextpass"
Issues = "https://github.com/gdamdam/nextpass/issues"
