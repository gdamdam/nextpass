[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nextpass"
dynamic = ["version", "dependencies"]
description = "Satellite pass prediction for weather, space station, and amateur satellites"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.9"

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[project.scripts]
nextpass = "nextpass.meteor_passes:main"

[tool.setuptools]
packages = ["nextpass"]

[tool.setuptools.package-data]
nextpass = ["catalog.json"]

[tool.setuptools.dynamic]
version = {attr = "nextpass.version.APP_VERSION"}
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.urls]
Homepage = "https://github.com/gdamdam/nextpass"
Issues = "https://github.com/gdamdam/nextpass/issues"
